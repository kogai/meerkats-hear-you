name: agent

# エージェント本体のビルドとテスト。
#
# 音声キャプチャは実機でしか動かせないため、MeerkatsCore には AVFoundation に依存しない
# 純粋ロジックだけを置いている。ここで検証できるのはそのロジックと、SQLiteへの読み書き。
# 実際のマイク入力を伴う部分は実機での確認が必要になる。

on:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - name: ツールチェインの確認
        run: swift --version

      - name: ビルド
        run: swift build -v

      - name: テスト
        run: swift test

      - name: バンドルの組み立てと署名
        run: ./build.sh

      - name: Info.plist が妥当か
        run: plutil -lint build/Meerkats.app/Contents/Info.plist

      - name: 常駐として起動する設定になっているか
        run: plutil -extract LSUIElement raw build/Meerkats.app/Contents/Info.plist

      # これが無いとマイクを要求した時点でプロセスが落ちる。実機でしか気づけない類の失敗なので、
      # 存在だけはここで確かめておく。
      - name: マイクの用途説明があるか
        run: plutil -extract NSMicrophoneUsageDescription raw build/Meerkats.app/Contents/Info.plist

      # 受信音声のタップ(ADR-0008)にはマイクとは別の鍵が要る。無いとタップが張れない。
      # 同じ理由がより強く当てはまるのに、こちらだけ確かめていなかった。
      - name: 音声取り込みの用途説明があるか
        run: plutil -extract NSAudioCaptureUsageDescription raw build/Meerkats.app/Contents/Info.plist

      - name: 署名の検証
        run: codesign --verify --strict --verbose=2 build/Meerkats.app
