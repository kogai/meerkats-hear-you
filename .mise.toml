[tools]
python = "3.12"

[tasks.install]
description = "Install Python dependencies for the mac mic verification tool"
dir = "experiments/mac-mic-verification"
run = "pip install -r requirements.txt"

[tasks.verify]
description = "Record from the default mic and run level/VAD analysis"
dir = "experiments/mac-mic-verification"
depends = ["install"]
run = "python3 verify.py"

[tasks.list-devices]
description = "List available audio devices"
dir = "experiments/mac-mic-verification"
depends = ["install"]
run = "python3 verify.py --list-devices"

[tasks.xcorr]
description = "Measure how precisely 1s-aggregated level series can be aligned"
dir = "experiments"
run = "python3 xcorr-alignment-resolution.py"
